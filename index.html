<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>128 Newbury Yard Sale</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #000;
        }

        .flyer {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100dvh;

            /* Fills EVERYTHING without cropping */
            object-fit: fill;

            display: block;
        }
    </style>
</head>

<body>

    <img
        class="flyer"
        src="10314A52-CED0-4C8B-9953-99D4AAE7F824.png"
        alt="128 Newbury Yard Sale"
    >

</body>
</html>
