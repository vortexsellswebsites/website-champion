<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>128 Newbury Yard Sale</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
        }

        .flyer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>

<body>

    <img
        class="flyer"
        src="10314A52-CED0-4C8B-9953-99D4AAE7F824.png"
        alt="128 Newbury Yard Sale"
    >

</body>
</html>
